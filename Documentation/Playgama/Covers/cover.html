<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Merge &amp; Munch covers</title>
<!-- Store covers. Render one layout per file URL hash: #square (800x800), #portrait (1080x1920), #landscape (1920x1080). -->
<style>
@font-face { font-family: 'Lilita One'; src: url('fonts/LilitaOne.ttf'); }
html, body { margin: 0; background: transparent; }
.cover { position: relative; overflow: hidden; font-family: 'Lilita One', sans-serif; display: none; }
body.square .cover.square, body.portrait .cover.portrait, body.landscape .cover.landscape { display: block; }
.cover.square { width: 800px; height: 800px; --u: 0.74; --cx: 50%; --cy: 44%; }
.cover.portrait { width: 1080px; height: 1920px; --u: 1; --cx: 50%; --cy: 40%; }
.cover.landscape { width: 1920px; height: 1080px; --u: 1; --cx: 68%; --cy: 46%; }

/* Sunburst kitchen */
.bg { position: absolute; inset: 0; background: radial-gradient(circle at var(--cx) var(--cy), #FFF1C9 0%, #FFC6A6 30%, #F48C7E 68%, #D65F70 100%); }
.rays { position: absolute; inset: -20%; background: repeating-conic-gradient(from 3deg at var(--cx) var(--cy), rgba(255,255,255,0.18) 0deg 8deg, rgba(255,255,255,0) 8deg 16deg); }
.dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(255,247,236,0.42) 0 7px, transparent 8px); background-size: 96px 96px; mask-image: radial-gradient(circle at var(--cx) var(--cy), transparent 22%, black 70%); -webkit-mask-image: radial-gradient(circle at var(--cx) var(--cy), transparent 22%, black 70%); }
.counter { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(#FFD88A 0 10px, #F2B860 10px, #E39C45 60%, #C9803A); box-shadow: 0 -10px 0 rgba(90,58,46,0.18); }
.counter::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 38%; background: repeating-linear-gradient(90deg, transparent 0 236px, rgba(90,58,46,0.18) 236px 242px), #A8D3CE; border-top: 8px solid #8FBFBA; }

/* Title: cream fill, thick cocoa stroke, extruded */
.title { position: absolute; transform: rotate(-4deg); text-align: center; line-height: 0.92; }
.title .merge { display: block; color: #FFF7EC; -webkit-text-stroke: calc(18px * var(--u)) #5A3A2E; paint-order: stroke fill; text-shadow: 0 calc(14px * var(--u)) 0 #5A3A2E, 0 calc(22px * var(--u)) 0 #C24E35, 0 calc(30px * var(--u)) calc(30px * var(--u)) rgba(90,58,46,0.35); letter-spacing: 2px; }
.title .munch { display: inline-block; color: #FFC94D; -webkit-text-stroke: calc(14px * var(--u)) #5A3A2E; paint-order: stroke fill; text-shadow: 0 calc(10px * var(--u)) 0 #5A3A2E, 0 calc(18px * var(--u)) calc(20px * var(--u)) rgba(90,58,46,0.35); }

.bunny, .food, .burst, .spark, .glow { position: absolute; }
.glow { border-radius: 50%; background: radial-gradient(circle, rgba(255,250,220,0.9), rgba(255,250,220,0) 65%); }
.food { filter: drop-shadow(0 calc(16px * var(--u)) calc(10px * var(--u)) rgba(90,58,46,0.35)); }
.bunny { filter: drop-shadow(0 calc(18px * var(--u)) calc(14px * var(--u)) rgba(90,58,46,0.3)); }
.burst { display: flex; align-items: center; justify-content: center; background: #FFC94D; clip-path: polygon(50% 0%, 61% 18%, 82% 9%, 79% 31%, 100% 38%, 84% 54%, 96% 74%, 73% 75%, 67% 97%, 50% 84%, 33% 97%, 27% 75%, 4% 74%, 16% 54%, 0% 38%, 21% 31%, 18% 9%, 39% 18%); color: #5A3A2E; transform: rotate(10deg); }
.burst span { color: #FFF7EC; -webkit-text-stroke: calc(9px * var(--u)) #5A3A2E; paint-order: stroke fill; }
.spark { background: #FFFFFF; clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); }
</style>
</head>
<body>
<script>document.body.className = (location.hash || '#portrait').slice(1);</script>

<!-- Portrait 9:16 -->
<div class="cover portrait">
  <div class="bg"></div><div class="rays"></div><div class="dots"></div>

  <div class="spark" style="left: 120px; top: 760px; width: 90px; height: 90px"></div>
  <div class="spark" style="left: 900px; top: 640px; width: 70px; height: 70px"></div>
  <div class="spark" style="left: 250px; top: 1180px; width: 60px; height: 60px"></div>

</div>

</body>
</html>
